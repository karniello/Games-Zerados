<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVault - Diário de Jogos Zerados</title>
    <meta name="description" content="Aplicativo para cadastrar e gerenciar jogos zerados com busca automática na internet, capas, estatísticas detalhadas por ano e mês, matriz de notas e dificuldade, e backup." />
    <meta property="og:title" content="GameVault - Diário de Jogos Zerados" />
    <meta property="og:description" content="Aplicativo para cadastrar e gerenciar jogos zerados com busca automática na internet, capas, estatísticas detalhadas por ano e mês, matriz de notas e dificuldade, e backup." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameVault" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Runtime constraint: "HMR: Disabled. Ignore WebSocket errors."
      (function() {
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          var file = (e && e.filename) ? String(e.filename) : '';
          if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || file.includes('@vite/client')) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
          if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport') || reason.includes('@vite/client')) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[SW] Registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
